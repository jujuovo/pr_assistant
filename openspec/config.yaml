schema: spec-driven

context: |
  本项目是用于推免材料申报、审核、加分统计与排名展示的高利害教育决策系统。
  OpenSpec 工件使用简体中文编写，代码标识符、接口字段与命令保持原文。
  目标业务链必须清晰且可追溯：证明材料 -> 核验结论 -> 规则计分明细 -> 学生汇总分 -> 排名结果。
  正式业务规则、权限校验、状态转换、计分和排名以后端为唯一权威来源；前端负责交互与展示，不得成为正式业务一致性的维护者。
  后端采用模块化单体，复杂业务通过用例层协调领域规则、事务和副作用；不要为解耦而引入微服务。
  核心业务动作必须具有明确事务边界，避免由前端串联多个接口产生部分成功。
  OCR 仅用于辅助提取和预览，不得自动认定材料真实性、审核结论或最终加分；OCR 失败时应保留人工处理路径。
  排名必须区分动态试算与正式发布。正式结果应绑定年度或批次、范围、规则版本、生成时间和发布状态，发布后不得被静默改写。
  Application 与 MaterialRecord 当前存在重叠职责。变更应采用渐进迁移，明确唯一主模型、兼容边界和退场路径，并保留历史证据与审计信息。
  本地开发使用 Vue 3/Vite、Flask、SQLAlchemy 与 SQLite；生产数据库和部署迁移需单独验证，不得用本地 SQLite 结果替代生产结论。

rules:
  proposal:
    - 明确说明用户问题、目标结果、范围内事项和范围外事项。
    - 说明变更影响的角色、业务阶段与现有 Application/MaterialRecord 流程。
    - 对涉及审核、计分或排名的变更，说明审计、历史兼容和正式结果风险。
  design:
    - 明确模块职责、数据所有权、依赖方向和用例层边界。
    - 对复杂业务动作给出状态转换、事务边界、失败回滚和幂等策略。
    - 记录 API 契约、规则版本、派生数据失效与重算机制。
    - 涉及新旧模型收敛时，必须描述渐进迁移、兼容期和退出条件。
    - 区分必须同步提交的核心一致性操作与可异步重试的 OCR、通知等副作用。
  specs:
    - 使用可验证的 MUST/SHALL 要求以及 Given/When/Then 场景。
    - 覆盖学生、教师和管理员的权限边界，以及非法状态转换和部分失败场景。
    - 涉及排名时，覆盖试算与正式发布、排名范围、同分规则、更新时间和结果失效。
    - 涉及计分时，覆盖规则版本、分类封顶、重复材料、撤回、补正和重算。
  tasks:
    - 按可独立验证的小步骤拆分，先建立后端业务不变量与契约，再接入前端流程。
    - 每个行为变更都包含相应测试或明确的验证步骤。
    - 数据迁移、兼容清理和旧路径退场必须列为显式任务，不得隐含在实现任务中。

operations:
  apply:
    guidance:
      - 保持模块化单体，不在没有独立部署需求时引入微服务或消息队列。
      - 不进行破坏性数据库变更，除非规格中已有迁移、备份、回滚和历史数据验证方案。
      - 优先复用统一用例，避免在 Blueprint、页面或批处理入口复制审核与计分规则。
      - 验证至少覆盖相关后端测试、前端测试、生产构建和三角色关键旅程；未实际验证的平台或环境不得宣称通过。
      - 不提交数据库、上传原件、日志、会话、OCR 模型、密钥、虚拟环境或 node_modules。
  archive:
    guidance:
      - 归档前确认任务、规格验证和迁移收尾均已完成，并记录仍保留的兼容路径与技术债。
      - 摘要说明最终业务行为、验证结果以及对历史数据和正式排名的影响。

name: Windows and macOS verification
on: [push, pull_request]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-ocr.txt
      - run: python -m pip check
      - run: python -B backend/tools/prepare_local.py
      - run: python -B backend/tools/prepare_local.py
      - run: python -B -m pytest backend/tests -q -p no:cacheprovider
      - run: npm ci --prefix frontend
      - run: node --test frontend/tests/material-api.test.mjs
      - run: npm --prefix frontend run build

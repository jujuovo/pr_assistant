name: Windows and macOS verification
on: [push, pull_request]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create isolated Python environment
        run: |
          python -m venv .venv-ci
          python -c "import os, pathlib; scripts = pathlib.Path('.venv-ci').resolve() / ('Scripts' if os.name == 'nt' else 'bin'); pathlib.Path(os.environ['GITHUB_PATH']).open('a', encoding='utf-8').write(str(scripts) + '\n')"
      - name: Verify isolated Python environment
        run: python -c "import sys; assert sys.prefix != sys.base_prefix, 'CI must use its isolated Python environment'; print(sys.executable)"
      - run: python -m pip install -r backend/requirements-ocr.txt
      - run: python -m pip check
      # 只需一次：prepare_local 是幂等的，第二步同步日期的场景留给本地手工执行
      - run: python -B backend/tools/prepare_local.py
      - run: python -B -m pytest backend/tests -q -p no:cacheprovider
      - run: npm ci --prefix frontend
      - run: node --test frontend/tests/*.test.mjs
      - run: python -B backend/tools/export_api_routes.py
      - run: npm --prefix frontend run test:mounted
        env:
          API_ROUTE_MANIFEST: ../backend/outputs/integration-api-routes.json
      - run: npm --prefix frontend run build

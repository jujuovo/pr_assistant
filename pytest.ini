[pytest]
testpaths = backend/tests
# 不要用 addopts = --basetemp=cache/test-runs/current：
# --basetemp 要求该目录**已存在**，而 cache/ 被 .gitignore 排除，
# 全新 checkout（CI、新克隆）里没有它，pytest 会在收集阶段直接报错，
# 表现为"整份测试套件全部 ERROR"，而不是某一个用例失败。
# 需要把临时产物留在仓库内时，先建目录再显式传参：
#   mkdir cache\test-runs\current; pytest --basetemp=cache/test-runs/current
cache_dir = cache/pytest

name: gradpush
x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile.backend
  env_file: ${APP_ENV_FILE:-.env}
  environment:
    APP_ENV: production
    APP_DATA_ROOT: /data
    OCR_MODEL_ROOT: /models
    PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
  volumes:
    - app-data:/data
    - ./models:/models:ro
  depends_on:
    db:
      condition: service_healthy
services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
  migrate:
    <<: *app
    command: [flask, --app, app, db, upgrade]
    restart: 'no'
  web:
    <<: *app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    <<: *app
    command: [python, recognition_worker.py]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      - web
volumes:
  app-data:
  postgres-data:
